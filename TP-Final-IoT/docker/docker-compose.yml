services:

  # ──────────────────────────────────────────
  # MQTT Broker
  # ──────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    #  - ./mosquitto/data:/mosquitto/data
    #  - ./mosquitto/log:/mosquitto/log
    # LE FORZAMOS EL ARCHIVO DE CONFIGURACIÓN ACÁ:
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  # ──────────────────────────────────────────
  # Node-RED
  # ──────────────────────────────────────────
  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      - mosquitto
      - influxdb

  # ──────────────────────────────────────────
  # InfluxDB v1.8
  # ──────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    #volumes:
    #- ./influxdb/data:/var/lib/influxdb
    environment:
    - INFLUXDB_DB=sensores
    - INFLUXDB_ADMIN_USER=admin
    - INFLUXDB_ADMIN_PASSWORD=admin123
    # Habilitar autenticación (opcional pero recomendado)
    - INFLUXDB_HTTP_AUTH_ENABLED=false
  


  # ──────────────────────────────────────────
  # Grafana
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
    # - ./grafana/data:/var/lib/grafana
    # --- CONFIGURACIÓN SIMPLIFICADA ---
      # Metemos el archivo de configuración directo en el provisioning de Grafana
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      # Metemos tu carpeta de JSONs en la ruta corta que inventamos arriba
      - ./grafana:/mis-dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - influxdb